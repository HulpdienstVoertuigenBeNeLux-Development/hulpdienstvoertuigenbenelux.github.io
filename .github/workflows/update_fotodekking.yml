name: Verwerk Fotodekking
on:
  workflow_dispatch:
  schedule:
    - cron: '30 */3 * * *' # Elke 3 uur (half uur, niet tegelijk met de voertuigtelling)

jobs:
  fotodekking:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        run: python process_fotodekking.py
      - name: Commit & Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add fotodekking.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen, stoppen..."
            exit 0
          fi
          git commit -m "Auto-update fotodekking.json"
          # Andere workflow kan intussen gepusht hebben
          git pull --rebase
          git push
