name: Wekelijkse Update Afkortingen

on:
  schedule:
    - cron: '0 0 * * 1' # Maandag 00:00
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: pip install pandas
      - name: Run Update Script
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python update_afkortingen.py
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Afkortingen.json
          git diff --staged --quiet || git commit -m "Update Afkortingen.json vanuit Secret URL"
          git push
